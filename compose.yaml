---
# The triage server over plain HTTP, for a trusted network. For HTTPS, add
# compose.caddy.yaml or compose.cloudflared.yaml, or put your own reverse proxy
# in front.
#
#   docker compose up -d
#   docker compose exec triage triage hosts add desktop

services:
  triage:
    image: ghcr.io/timmo001/triage:latest@sha256:4865ef65a340018a71e556a6958ec8b28f60cbe2f645b3747538c737a5745da4
    restart: unless-stopped
    ports:
      - ${TRIAGE_PORT:-7171}:7171
    volumes:
      - triage:/data

volumes:
  triage:
