---
name: triage
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
release: "1"
section: utils
priority: optional
maintainer: Aidan Timson <aidan@timmo.dev>
description: Capture crashes and errors from your machines, decide which are worth fixing, and suggest fixes
homepage: https://github.com/timmo001/triage
license: Apache-2.0
overrides:
  deb:
    depends:
      - libc6
      - systemd
  rpm:
    depends:
      - glibc
      - systemd
contents:
  - src: dist/release/root/triage
    dst: /usr/bin/triage
    file_info:
      mode: 0755
  - src: .scripts/linux/triage-agent.service
    dst: /usr/lib/systemd/user/triage-agent.service
  - src: .scripts/linux/triage-server.service
    dst: /usr/lib/systemd/user/triage-server.service
  - src: .scripts/linux/triage-worker.service
    dst: /usr/lib/systemd/user/triage-worker.service
  - src: .scripts/linux/completions/triage.bash
    dst: /usr/share/bash-completion/completions/triage
  - src: .scripts/linux/completions/triage.fish
    dst: /usr/share/fish/vendor_completions.d/triage.fish
  - src: .scripts/linux/completions/_triage
    dst: /usr/share/zsh/site-functions/_triage
  - src: LICENSE
    dst: /usr/share/licenses/triage/LICENSE
