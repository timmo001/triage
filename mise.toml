min_version = "2025.1.0"

[tools]
node = "26.10.0"
bun = "1.4.2"
pitchfork = "2.29.0"

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.dev]
description = "Run triage in watch mode"
depends = ["install"]
run = "bun run dev"

[tasks.build]
description = "Compile a minified, bytecode-cached triage binary"
depends = ["install"]
run = "bun run build"

[tasks."build:packages"]
description = "Build @timmo001/effect-triage and @timmo001/effect-triage-client into their dist directories"
depends = ["install"]
run = "bun run build:packages"

[tasks."version:sync"]
description = "Pin the client's @timmo001/effect-triage dependency and the Home Assistant app's image tag to the shared release version"
run = '''
version="$(bun pm pkg get version | tr -d '"')"
sed -i "s/^version: .*/version: $version/" app/config.yaml
cd packages/client
bun pm pkg set "dependencies.@timmo001/effect-triage=$version"
'''

[tasks."registries:setup"]
description = "Create the npm and JSR packages and link them to the release workflow (run once, by hand)"
depends = ["install"]
run = "bun scripts/setup-registries.ts"

[tasks.typecheck]
description = "Type-check the source"
depends = ["install"]
run = "bun run typecheck"

[tasks.test]
description = "Run tests"
depends = ["install"]
run = "bun run test"

[tasks.lint]
description = "Lint source with the shared Oxlint rules"
depends = ["install"]
run = "bun run lint"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check, and verify formatting"
depends = ["lint", "typecheck", "format:check"]

[tasks."serve:server"]
description = "Start a local server in watch mode in the background through Pitchfork"
depends = ["install"]
run = "pitchfork start server"

[tasks."serve:server:status"]
description = "Show the background local server status"
run = "pitchfork status server"

[tasks."serve:server:logs"]
description = "Follow the background local server logs"
run = "pitchfork logs -t server"

[tasks."serve:server:restart"]
description = "Restart the background local server"
run = "pitchfork restart server"

[tasks."serve:server:stop"]
description = "Stop the background local server"
run = "pitchfork stop server"

[tasks."serve:server:enrol"]
description = "Enrol a host with the background local server, printing its token"
usage = 'arg "<name>" help="The host name, such as desktop"'
run = 'TRIAGE_SERVER_DB="${XDG_STATE_HOME:-$HOME/.local/state}/triage/dev-server.db" bun run src/index.ts hosts add "${usage_name?}"'
