min_version = "2025.1.0"

[tools]
node = "26.10.0"
bun = "1.4.2"
pitchfork = "2.29.0"

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.dev]
description = "Run triage in watch mode"
depends = ["install"]
run = "bun run dev"

[tasks.build]
description = "Compile a minified, bytecode-cached triage binary"
depends = ["install"]
run = "bun run build"

[tasks."build:packages"]
description = "Build @timmo001/effect-triage and @timmo001/effect-triage-client into their dist directories"
depends = ["install"]
run = "bun run build:packages"

[tasks."version:sync"]
description = "Pin the client's @timmo001/effect-triage dependency and the Home Assistant app's image tag to the shared release version"
run = '''
version="$(bun pm pkg get version | tr -d '"')"
sed -i "s/^version: .*/version: $version/" home-assistant/app/config.yaml
cd packages/client
bun pm pkg set "dependencies.@timmo001/effect-triage=$version"
'''

[tasks."registries:setup"]
description = "Create the npm and JSR packages and link them to the release workflow (run once, by hand)"
depends = ["install"]
run = "bun scripts/setup-registries.ts"

[tasks.typecheck]
description = "Type-check the source"
depends = ["install"]
run = "bun run typecheck"

[tasks.test]
description = "Run tests"
depends = ["install"]
run = "bun run test"

[tasks.lint]
description = "Lint source with the shared Oxlint rules"
depends = ["install"]
run = "bun run lint"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check, and verify formatting"
depends = ["lint", "typecheck", "format:check"]

[tasks."docs:gen"]
description = "Regenerate the docs command reference from the CLI's help"
depends = ["install"]
run = "bun scripts/generate-cli-reference.ts"

[tasks."docs:install"]
description = "Install docs dependencies"
dir = "docs"
run = "bun install"

[tasks."docs:dev"]
description = "Run the docs dev server"
depends = ["docs:install"]
dir = "docs"
# A reused Vite cache makes every page fail to resolve Astro's ClientRouter script
run = ["rm -rf .blume/.cache/vite", "bun run dev"]

[tasks."docs:build"]
description = "Build the docs site"
depends = ["docs:install"]
dir = "docs"
run = "bun run build"

[tasks."docs:preview"]
description = "Preview the built docs site"
dir = "docs"
run = "bun run preview"

[tasks."serve:docs:dev"]
description = "Start the docs dev server in the background through Pitchfork"
run = "pitchfork start docs"

[tasks."serve:docs:status"]
description = "Show the background docs dev server status"
run = "pitchfork status docs"

[tasks."serve:docs:logs"]
description = "Follow the background docs dev server logs"
run = "pitchfork logs -t docs"

[tasks."serve:docs:restart"]
description = "Restart the background docs dev server"
run = "pitchfork restart docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"

[tasks."serve:server"]
description = "Start a local server in watch mode in the background through Pitchfork"
depends = ["install"]
run = "pitchfork start server"

[tasks."serve:server:status"]
description = "Show the background local server status"
run = "pitchfork status server"

[tasks."serve:server:logs"]
description = "Follow the background local server logs"
run = "pitchfork logs -t server"

[tasks."serve:server:restart"]
description = "Restart the background local server"
run = "pitchfork restart server"

[tasks."serve:server:stop"]
description = "Stop the background local server"
run = "pitchfork stop server"

[tasks."serve:web"]
description = "Start the web UI with hot reloading in the background through Pitchfork, using the background local server"
depends = ["install"]
run = ["pitchfork start server", "pitchfork start web"]

[tasks."serve:web:status"]
description = "Show the background web UI status"
run = "pitchfork status web"

[tasks."serve:web:logs"]
description = "Follow the background web UI logs"
run = "pitchfork logs -t web"

[tasks."serve:web:restart"]
description = "Restart the background web UI"
run = "pitchfork restart web"

[tasks."serve:web:stop"]
description = "Stop the background web UI"
run = "pitchfork stop web"

[tasks."serve:server:enrol"]
description = "Enrol a host with the background local server, printing its token"
usage = 'arg "<name>" help="The host name, such as desktop"'
run = 'TRIAGE_SERVER_DB="${XDG_STATE_HOME:-$HOME/.local/state}/triage/dev-server.db" bun run src/index.ts hosts add "${usage_name?}"'
