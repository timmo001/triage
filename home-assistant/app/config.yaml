---
name: Triage
version: 0.13.0
slug: triage
description: Collect crashes and errors from your machines, and decide which are worth fixing
url: https://github.com/timmo001/triage
arch:
  - aarch64
  - amd64
image: ghcr.io/timmo001/triage-app
ports:
  7171/tcp: 7171
ports_description:
  7171/tcp: The triage server's API, for hosts, workers and admins
watchdog: http://[HOST]:[PORT:7171]/api/health
# Home Assistant signs the user in, so the ingress port treats them as an
# admin. It only answers the Supervisor, and the panel is for admins only.
ingress: true
ingress_port: 8099
panel_icon: mdi:clipboard-pulse-outline
# Announces the MCP server on the ingress port, so Assist can read and change issues.
discovery:
  - mcp
environment:
  TRIAGE_OPTIONS: /data/options.json
  TRIAGE_INGRESS_PORT: "8099"
# Stopped during backups so the SQLite database is copied in a consistent
# state. Agents keep events until the server is back.
backup: cold
options:
  trust_proxy: false
  decide_daily: 100
  suggest_daily: 5
  new_hours: 24
  quiet_hours: 72
  language: en
schema:
  server_admin_token: password?
  trust_proxy: bool
  decide_daily: int(0,)
  suggest_daily: int(0,)
  new_hours: int(1,)
  quiet_hours: int(1,)
  language: list(en|de|es|fr|it|ja|nl|pl|pt-BR|zh-Hans)
