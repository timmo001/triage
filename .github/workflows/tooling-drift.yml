---
name: Tooling drift

# Opens a review pull request when a Supervisor release is newer than the one
# recorded in tooling.yml, through the tooling-drift tool pinned in mise.toml.
# See the tooling-drift skill.

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tooling-drift
  cancel-in-progress: false

jobs:
  drift:
    if: github.repository == 'timmo001/triage'
    uses: timmo001/workflows/.github/workflows/tooling-drift.yml@4684bb98d86ce0367028aa5d72fc8d178b102e63 # 20261012.0
    permissions:
      actions: write
      contents: write
      pull-requests: write
    secrets:
      token: ${{ secrets.TOOLING_DRIFT_TOKEN }}
