---
name: Release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  tools:
    name: Resolve release tools
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      bun: ${{ steps.versions.outputs.bun }}
      node: ${{ steps.versions.outputs.node }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Read tool versions
        id: versions
        run: |
          printf 'bun=%s\n' "$(mise current bun)" >> "$GITHUB_OUTPUT"
          printf 'node=%s\n' "$(mise current node)" >> "$GITHUB_OUTPUT"

  # The Supervisor shows the app's CHANGELOG.md from the default branch, so copy
  # the release notes there. The ruleset blocks GITHUB_TOKEN from pushing to
  # main, so this pushes with an admin's token, which can bypass it.
  app-changelog:
    name: Home Assistant app changelog
    uses: timmo001/workflows/.github/workflows/home-assistant-app-changelog.yml@36ba6651f1296cce685ede8ac38b9574c9291028 # master
    with:
      changelog-path: home-assistant/app/CHANGELOG.md
    secrets:
      token: ${{ secrets.RELEASE_COMMIT_TOKEN }}

  effect-triage-npm:
    name: effect-triage npm
    needs: tools
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/effect-triage
      check-command: cd ../.. && bun run check && bun run test

  effect-triage-jsr:
    name: effect-triage JSR
    needs: tools
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-jsr-package.yml@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      package-path: packages/effect-triage
      check-command: (cd ../.. && bun run check && bun run test) && bun run build

  # The client pins @timmo001/effect-triage to this release, so publish it once effect-triage is out.
  client-npm:
    name: effect-triage-client npm
    needs:
      - tools
      - effect-triage-npm
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/client
      check-command: cd ../.. && bun run check && bun run test

  client-jsr:
    name: effect-triage-client JSR
    needs:
      - tools
      - effect-triage-jsr
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-jsr-package.yml@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      package-path: packages/client
      # The JSR entry resolves @timmo001/effect-triage from the workspace, so build it too.
      check-command: cd ../.. && bun run check && bun run test && bun run build:packages

  linux:
    name: Linux
    needs: tools
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: timmo001/workflows/.github/workflows/release-bun-cli-linux.yml@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0
    with:
      binary-name: triage
      entrypoint: src/index.ts
      package-config: .scripts/linux/nfpm.yaml
      bun-version: ${{ needs.tools.outputs.bun }}
      smoke-test-arguments: |-
        --version
        --help
      package-prepare-command: |-
        mkdir -p .scripts/linux/completions
        ./dist/release/root/triage --completions bash > .scripts/linux/completions/triage.bash
        ./dist/release/root/triage --completions fish > .scripts/linux/completions/triage.fish
        ./dist/release/root/triage --completions zsh > .scripts/linux/completions/_triage
        cp -R skills dist/release/root/skills
      # Ship the agent skills beside the binary, so a mise install keeps them matched to it.
      archive-extra-paths: skills
      release-version: ${{ github.event.release.tag_name }}
      source-ref: ${{ github.event.release.tag_name }}
      existing-release: true
      attest: true

  prepare-arch-bin:
    name: Prepare Arch package (triage-bin)
    needs: linux
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_VERSION }}

      - name: Render PKGBUILD
        uses: timmo001/workflows/.github/actions/prepare-arch-bin@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0
        with:
          releaseVersion: ${{ env.RELEASE_VERSION }}
          packageName: triage
          pkgbuildTemplate: .scripts/linux/PKGBUILD.bin
          outputDirectory: ${{ runner.temp }}/arch-bin
          completionsArguments: "--completions {shell}"
          extraFiles: |-
            LICENSE
            .scripts/linux/triage-agent.service
            .scripts/linux/triage-server.service
            .scripts/linux/triage-worker.service
            .scripts/linux/triage.install

      # Named by the run alone, not its attempt, so re-running only a failed
      # build still finds the files this job made on an earlier attempt.
      - name: Upload package files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arch-triage-bin-${{ github.run_id }}
          path: ${{ runner.temp }}/arch-bin
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  arch-bin:
    name: Arch package (triage-bin)
    needs: prepare-arch-bin
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0
    with:
      package-name: triage-bin
      package-files-artifact-name: arch-triage-bin-${{ github.run_id }}
      pkgbuild-path: PKGBUILD
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}

  attach-arch-bin:
    name: Attach Arch package (triage-bin)
    needs: arch-bin
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: timmo001/workflows/.github/workflows/attach-release-arch-package.yml@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0
    with:
      artifact-name: ${{ needs.arch-bin.outputs.artifact-name }}
      release-tag: ${{ github.event.release.tag_name }}
      package-name: triage-bin

  # One multi-arch image per target: ghcr.io/timmo001/triage for Docker, and
  # ghcr.io/timmo001/triage-app, which runs as root, for the Home Assistant app.
  image-server:
    name: Container image (server)
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: read
      packages: write
    uses: timmo001/workflows/.github/workflows/build-container-image.yml@36ba6651f1296cce685ede8ac38b9574c9291028 # master
    with:
      image: ghcr.io/timmo001/triage
      target: server
      version: ${{ github.event.release.tag_name }}
      home-assistant: true

  image-app:
    name: Container image (app)
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: read
      packages: write
    uses: timmo001/workflows/.github/workflows/build-container-image.yml@36ba6651f1296cce685ede8ac38b9574c9291028 # master
    with:
      image: ghcr.io/timmo001/triage-app
      target: app
      version: ${{ github.event.release.tag_name }}
      home-assistant: true

  # Asks timmo001/home-assistant-apps to copy this release's app folder, now
  # its image is pushed.
  home-assistant-apps:
    name: Home Assistant apps repository
    needs:
      - image-server
      - image-app
    uses: timmo001/workflows/.github/workflows/home-assistant-app-dispatch.yml@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0
    with:
      repository: timmo001/home-assistant-apps
    secrets:
      token: ${{ secrets.RELEASE_COMMIT_TOKEN }}
