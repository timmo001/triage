---
name: Release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  tools:
    name: Resolve release tools
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      bun: ${{ steps.versions.outputs.bun }}
      node: ${{ steps.versions.outputs.node }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0

      - name: Read tool versions
        id: versions
        run: |
          printf 'bun=%s\n' "$(mise current bun)" >> "$GITHUB_OUTPUT"
          printf 'node=%s\n' "$(mise current node)" >> "$GITHUB_OUTPUT"

  effect-triage-npm:
    name: effect-triage npm
    needs: tools
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@82ee28374d3471231113dabc3dd436f65a47132f # 20261004.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/effect-triage
      check-command: cd ../.. && bun run check && bun run test

  effect-triage-jsr:
    name: effect-triage JSR
    needs: tools
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-jsr-package.yml@82ee28374d3471231113dabc3dd436f65a47132f # 20261004.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      package-path: packages/effect-triage
      check-command: (cd ../.. && bun run check && bun run test) && bun run build

  # The client pins @timmo001/effect-triage to this release, so publish it once effect-triage is out.
  client-npm:
    name: effect-triage-client npm
    needs:
      - tools
      - effect-triage-npm
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@82ee28374d3471231113dabc3dd436f65a47132f # 20261004.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/client
      check-command: cd ../.. && bun run check && bun run test

  client-jsr:
    name: effect-triage-client JSR
    needs:
      - tools
      - effect-triage-jsr
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-jsr-package.yml@82ee28374d3471231113dabc3dd436f65a47132f # 20261004.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      package-path: packages/client
      # The JSR entry resolves @timmo001/effect-triage from the workspace, so build it too.
      check-command: cd ../.. && bun run check && bun run test && bun run build:packages

  # amd64 only for now: Bun's compile step is unreliable under QEMU. Add arm64
  # through native arm runners with the Home Assistant app.
  image:
    name: Container image
    needs: tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
