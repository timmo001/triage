---
name: Release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  tools:
    name: Resolve release tools
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      bun: ${{ steps.versions.outputs.bun }}
      node: ${{ steps.versions.outputs.node }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Read tool versions
        id: versions
        run: |
          printf 'bun=%s\n' "$(mise current bun)" >> "$GITHUB_OUTPUT"
          printf 'node=%s\n' "$(mise current node)" >> "$GITHUB_OUTPUT"

  # The Supervisor shows the app's CHANGELOG.md from the default branch, so copy
  # the release notes there. The ruleset blocks GITHUB_TOKEN from pushing to
  # main, so this pushes with an admin's token, which can bypass it. A missing
  # changelog shouldn't fail the release, so failures only warn.
  app-changelog:
    name: Home Assistant app changelog
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.RELEASE_COMMIT_TOKEN }}

      - name: Write changelog
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: printf '%s\n' "$RELEASE_NOTES" | tr -d '\r' > home-assistant/app/CHANGELOG.md

      - name: Commit changelog
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- home-assistant/app/CHANGELOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-assistant/app/CHANGELOG.md
          git commit -m "Update Home Assistant app changelog for $RELEASE_VERSION"
          git push

      - name: Warn about missing changelog
        if: ${{ failure() }}
        run: echo "::warning title=Home Assistant app changelog::Couldn't commit the release notes to home-assistant/app/CHANGELOG.md. Check RELEASE_COMMIT_TOKEN, then update the file by hand."

  effect-triage-npm:
    name: effect-triage npm
    needs: tools
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/effect-triage
      check-command: cd ../.. && bun run check && bun run test

  effect-triage-jsr:
    name: effect-triage JSR
    needs: tools
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-jsr-package.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      package-path: packages/effect-triage
      check-command: (cd ../.. && bun run check && bun run test) && bun run build

  # The client pins @timmo001/effect-triage to this release, so publish it once effect-triage is out.
  client-npm:
    name: effect-triage-client npm
    needs:
      - tools
      - effect-triage-npm
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/client
      check-command: cd ../.. && bun run check && bun run test

  client-jsr:
    name: effect-triage-client JSR
    needs:
      - tools
      - effect-triage-jsr
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-jsr-package.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      package-path: packages/client
      # The JSR entry resolves @timmo001/effect-triage from the workspace, so build it too.
      check-command: cd ../.. && bun run check && bun run test && bun run build:packages

  linux:
    name: Linux
    needs: tools
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: timmo001/workflows/.github/workflows/release-bun-cli-linux.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
    with:
      binary-name: triage
      entrypoint: src/index.ts
      package-config: .scripts/linux/nfpm.yaml
      bun-version: ${{ needs.tools.outputs.bun }}
      smoke-test-arguments: |-
        --version
        --help
      package-prepare-command: |-
        mkdir -p .scripts/linux/completions
        ./dist/release/root/triage --completions bash > .scripts/linux/completions/triage.bash
        ./dist/release/root/triage --completions fish > .scripts/linux/completions/triage.fish
        ./dist/release/root/triage --completions zsh > .scripts/linux/completions/_triage
      release-version: ${{ github.event.release.tag_name }}
      source-ref: ${{ github.event.release.tag_name }}
      existing-release: true
      attest: true

  prepare-arch-bin:
    name: Prepare Arch package (triage-bin)
    needs: linux
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_VERSION }}

      - name: Render PKGBUILD
        uses: timmo001/workflows/.github/actions/prepare-arch-bin@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
        with:
          releaseVersion: ${{ env.RELEASE_VERSION }}
          packageName: triage
          pkgbuildTemplate: .scripts/linux/PKGBUILD.bin
          outputDirectory: ${{ runner.temp }}/arch-bin
          completionsArguments: "--completions {shell}"
          extraFiles: |-
            LICENSE
            .scripts/linux/triage-agent.service
            .scripts/linux/triage-server.service
            .scripts/linux/triage-worker.service
            .scripts/linux/triage.install

      - name: Upload package files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arch-triage-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arch-bin
          if-no-files-found: error
          retention-days: 1

  arch-bin:
    name: Arch package (triage-bin)
    needs: prepare-arch-bin
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
    with:
      package-name: triage-bin
      package-files-artifact-name: arch-triage-bin-${{ github.run_id }}-${{ github.run_attempt }}
      pkgbuild-path: PKGBUILD
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}

  attach-arch-bin:
    name: Attach Arch package (triage-bin)
    needs: arch-bin
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: timmo001/workflows/.github/workflows/attach-release-arch-package.yml@2fb8b15d5e72caaea35cc5e4541733d87ef66002 # 20261008.0
    with:
      artifact-name: ${{ needs.arch-bin.outputs.artifact-name }}
      release-tag: ${{ github.event.release.tag_name }}
      package-name: triage-bin

  # Each architecture builds on its own native runner, since Bun's compile step
  # is unreliable under QEMU, and is pushed by digest. image-manifest then tags
  # one multi-arch manifest per image: ghcr.io/timmo001/triage for Docker, and
  # ghcr.io/timmo001/triage-app, which runs as root, for the Home Assistant app.
  image:
    name: Container image (${{ matrix.target }}, ${{ matrix.arch }})
    needs: tools
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target:
          - server
          - app
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            hass-arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            hass-arch: aarch64
            runner: ubuntu-24.04-arm
          - target: server
            suffix: ""
          - target: app
            suffix: -app
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          labels: |
            io.hass.type=app
            io.hass.arch=${{ matrix.hass-arch }}
            io.hass.version=${{ github.event.release.tag_name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}${{ matrix.suffix }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: Container image manifest (${{ matrix.target }})
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: server
            suffix: ""
          - target: app
            suffix: -app
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: image-digest-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create and push manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
