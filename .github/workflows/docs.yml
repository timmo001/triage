---
name: Docs

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/index.ts"
      - "scripts/generate-cli-reference.ts"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/index.ts"
      - "scripts/generate-cli-reference.ts"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Regenerate the command reference
        run: mise run docs:gen

      - name: Check the command reference is up to date
        run: |
          changes="$(git status --porcelain -- docs/src/content/docs/commands docs/commands-sidebar.json)"
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi

      - name: Build docs
        run: mise run docs:build

      - name: Check docs
        working-directory: docs
        run: bun run check && bun run validate
