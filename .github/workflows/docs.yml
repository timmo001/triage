---
name: Docs

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/index.ts"
      - "web/src/design.css"
      - "scripts/generate-cli-reference.ts"
      - "scripts/generate-design-reference.ts"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/index.ts"
      - "web/src/design.css"
      - "scripts/generate-cli-reference.ts"
      - "scripts/generate-design-reference.ts"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/check-docs.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
    with:
      generated-paths: |-
        docs/src/content/docs/commands
        docs/commands-sidebar.json
        docs/src/content/docs/design
        docs/theme.css
      extra-checks: cd docs && bun run --parallel --no-exit-on-error check validate
