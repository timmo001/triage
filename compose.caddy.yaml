---
# Serves triage over HTTPS through Caddy, which gets certificates for
# TRIAGE_DOMAIN automatically. The server is only reachable through Caddy, so
# it trusts Caddy's forwarded headers.
#
#   TRIAGE_DOMAIN=triage.example.com docker compose -f compose.yaml -f compose.caddy.yaml up -d

services:
  triage:
    ports: !reset []
    environment:
      TRIAGE_TRUST_PROXY: "true"

  caddy:
    image: caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    restart: unless-stopped
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${TRIAGE_DOMAIN:?Set TRIAGE_DOMAIN to the server's domain}
      - --to
      - triage:7171
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - caddy:/data
    depends_on:
      - triage

volumes:
  caddy:
