# Keeps a local triage server and the docs dev server running in the
# background, outside the invoking shell or agent. Manage them with the
# serve:* mise tasks.

# Uses its own port and database so it never touches a real server's. The port
# moves up when 7172 is taken; with the pitchfork proxy enabled, the server is
# always at https://server.triage.localhost whichever port it gets.
[daemons.server]
run = 'TRIAGE_SERVER_DB="${XDG_STATE_HOME:-$HOME/.local/state}/triage/dev-server.db" exec bun run --watch src/index.ts serve --port "$PORT"'
port = { expect = [7172], bump = 10 }
ready_cmd = 'curl -fsS "http://127.0.0.1:$PORT/api/health"'
health_cmd = 'curl -fsS "http://127.0.0.1:$PORT/api/health"'
retry = true

[daemons.docs]
run = "exec mise run docs:dev"
ready_http = "http://localhost:4321/"
health_http = "http://localhost:4321/"
retry = true
